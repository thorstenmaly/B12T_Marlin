#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#                               #
#      ESP32 Architecture       #
#                               #
#################################

#
# Espressif ESP32
#
[env:esp32]
platform          = espressif32@2.1.0
board             = esp32dev
build_flags       = ${common.build_flags} -DCORE_DEBUG_LEVEL=0 -std=gnu++17
build_unflags     = -std=gnu11 -std=gnu++11
build_src_filter  = ${common.default_src_filter} +<src/HAL/ESP32>
lib_ignore        = NativeEthernet
upload_speed      = 500000
monitor_speed     = 250000
monitor_filters   = colorize, time, send_on_enter, log2file, esp32_exception_decoder
#upload_port      = marlinesp.local
#board_build.flash_mode = qio

# ESP32-S3 Mini 1 N8, native USB and AUX G-code.
[env:esp32_s3_mini_1_n8]
platform               = espressif32@6.9.0
# Pin the driver library explicitly; use upstream when the registry is unavailable.
lib_deps               = ${common.lib_deps}
                         TMCStepper=https://github.com/teemuatlut/TMCStepper/archive/refs/tags/v0.7.3.zip
extra_scripts          = ${common.extra_scripts}
                         pre:buildroot/share/PlatformIO/scripts/ensure_ide_build_dir.py
board                  = esp32-s3-devkitm-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.flash_mode = dio
build_flags            = ${common.build_flags} -DCORE_DEBUG_LEVEL=0 -std=gnu++17
                         -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags          = -std=gnu++11
build_src_filter       = ${common.default_src_filter} +<src/HAL/ESP32>
lib_ignore             = NativeEthernet
upload_protocol        = esptool
upload_speed           = 460800
monitor_speed          = 115200
monitor_dtr            = 0
monitor_rts            = 0
monitor_eol            = LF

# Temporary hardware diagnostic: USB heartbeat and received-byte echo, no motion.
[env:esp32_s3_mini_1_n8_usb_diagnostic]
extends                = env:esp32_s3_mini_1_n8
extra_scripts          =
lib_deps               =
build_flags            = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
                         -DESP32_S3_USB_DIAGNOSTIC
build_src_filter       = -<*> +<src/HAL/ESP32/usb_diagnostic.cpp>

[env:FYSETC_E4]
extends                = env:esp32
board_build.partitions = default_16MB.csv

[env:PANDA]
extends                = env:esp32
build_flags            = ${env:esp32.build_flags} -DUSE_ESP32_EXIO -DUSE_ESP32_TASK_WDT
lib_deps               = ${common.lib_deps}
                         SoftwareSerialEsp32
board_build.partitions = Marlin/src/HAL/ESP32/esp32.csv
upload_speed           = 115200
monitor_speed          = 115200

[env:mks_tinybee]
extends                = env:esp32
board_build.partitions = default_8MB.csv

[env:godi_esp32]
extends                = env:esp32
board_build.partitions = Marlin/src/HAL/ESP32/esp32.csv
upload_speed           = 115200
monitor_speed          = 115200
